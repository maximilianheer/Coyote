<text x="847.5" y="270" font-size="19" font-weight="normal" fill="#172b46" text-anchor="middle">100GbE</text>
<text x="847.5" y="296" font-size="19" font-weight="normal" fill="#172b46" text-anchor="middle">input</text>
<rect x="945" y="230" width="250" height="100" rx="14" fill="#fff0dc" stroke="#e5b67b" stroke-width="2"/>
<text x="1070.0" y="270" font-size="19" font-weight="normal" fill="#172b46" text-anchor="middle">Ethernet / IP / UDP</text>
<text x="1070.0" y="296" font-size="19" font-weight="normal" fill="#172b46" text-anchor="middle">RoCE + CRC + DMA</text>
<rect x="1230" y="230" width="205" height="100" rx="14" fill="#fff0dc" stroke="#e5b67b" stroke-width="2"/>
<text x="1332.5" y="261" font-size="19" font-weight="normal" fill="#172b46" text-anchor="middle">HBM storage</text>
<text x="1332.5" y="287" font-size="19" font-weight="normal" fill="#172b46" text-anchor="middle">+ inspection /</text>
<text x="1332.5" y="313" font-size="19" font-weight="normal" fill="#172b46" text-anchor="middle">GPU forwarding</text>
