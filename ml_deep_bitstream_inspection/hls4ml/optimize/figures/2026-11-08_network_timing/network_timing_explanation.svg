<text x="520" y="998" font-size="22" font-weight="bold" fill="#b35a13" text-anchor="start">467  (2.6×)</text>
<text x="785" y="819" font-size="25" font-weight="bold" fill="#172b46" text-anchor="start">How the current fallback adds margin</text>
<text x="785" y="862" font-size="22" font-weight="bold" fill="#172b46" text-anchor="start">HBM interface</text>
<text x="785" y="897" font-size="22" font-weight="normal" fill="#172b46" text-anchor="start">450 MHz: 2.22 ns</text>
