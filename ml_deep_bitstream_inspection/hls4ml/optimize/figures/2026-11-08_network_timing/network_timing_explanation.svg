<text x="320" y="961" font-size="22" font-weight="normal" fill="#1269a3" text-anchor="start">282k</text>
<text x="520" y="961" font-size="22" font-weight="bold" fill="#b35a13" text-anchor="start">610k  (2.2×)</text>
