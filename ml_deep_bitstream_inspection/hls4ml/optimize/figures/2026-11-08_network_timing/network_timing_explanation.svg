<path d="M1198 280 L1224 280" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="785" y="367" font-size="23" font-weight="bold" fill="#172b46" text-anchor="start">3 Coyote HBM interface paths + packet buffers</text>
<text x="785" y="402" font-size="20" font-weight="normal" fill="#172b46" text-anchor="start">Same converters; added HBM path and network logic.</text>
<rect x="40" y="450" width="1420" height="310" rx="14" fill="#ffffff" stroke="#d7e0eb" stroke-width="2"/>
<text x="65" y="492" font-size="27" font-weight="bold" fill="#172b46" text-anchor="start">The critical detail: one control signal must reach hundreds of registers</text>
