<path d="M445 695 L650 695" fill="none" stroke="#c65b30" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="660" y="683" width="310" height="25" rx="5" fill="#fff0dc" stroke="#e5b67b" stroke-width="2"/>
<text x="815" y="701" font-size="16" font-weight="normal" fill="#172b46" text-anchor="middle">Payload-register enables</text>
<text x="485" y="723" font-size="18" font-weight="normal" fill="#8e471f" text-anchor="start">Fanout + wire length + placement constraints</text>
<text x="1010" y="553" font-size="19" font-weight="bold" fill="#172b46" text-anchor="start">Each registered hop has a deadline</text>
<text x="1010" y="593" font-size="25" font-weight="bold" fill="#1269a3" text-anchor="start">450 MHz HBM → 2.22 ns</text>
<text x="1010" y="634" font-size="24" font-weight="bold" fill="#b73838" text-anchor="start">Measured miss: 0.529 ns</text>
<text x="1010" y="671" font-size="18" font-weight="normal" fill="#172b46" text-anchor="start">NET_DIAG attempt_06, HBM path_2</text>
<text x="1010" y="700" font-size="18" font-weight="normal" fill="#172b46" text-anchor="start">Path indices shift with RoCE enabled.</text>
<text x="65" y="744" font-size="19" font-weight="normal" fill="#172b46" text-anchor="start">Every hop is checked separately; the entire packet does not have to cross the pipeline in one cycle.</text>
<rect x="40" y="780" width="700" height="260" rx="14" fill="#ffffff" stroke="#d7e0eb" stroke-width="2"/>
<rect x="760" y="780" width="700" height="260" rx="14" fill="#ffffff" stroke="#d7e0eb" stroke-width="2"/>
<text x="65" y="819" font-size="25" font-weight="bold" fill="#172b46" text-anchor="start">More hardware to place and connect</text>
<text x="65" y="851" font-size="18" font-weight="normal" fill="#172b46" text-anchor="start">Routed GPU variants; network attempt failed timing</text>
<text x="320" y="887" font-size="20" font-weight="bold" fill="#172b46" text-anchor="start">HBM → GPU</text>
<text x="520" y="887" font-size="20" font-weight="bold" fill="#172b46" text-anchor="start">Network → GPU</text>
