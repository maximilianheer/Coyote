<rect x="760" y="120" width="700" height="310" rx="14" fill="#ffffff" stroke="#d7e0eb" stroke-width="2"/>
<text x="65" y="160" font-size="27" font-weight="bold" fill="#1269a3" text-anchor="start">HBM-resident cases</text>
<text x="785" y="160" font-size="27" font-weight="bold" fill="#b35a13" text-anchor="start">Network cases</text>
<text x="65" y="195" font-size="20" font-weight="normal" fill="#172b46" text-anchor="start">The input is already stored when the trial starts.</text>
<text x="785" y="195" font-size="20" font-weight="normal" fill="#172b46" text-anchor="start">The FPGA must receive, store and inspect/forward.</text>
<rect x="70" y="230" width="165" height="83" rx="14" fill="#e5f2fc" stroke="#9cc5e1" stroke-width="2"/>
