<text x="152.5" y="292" font-size="22" font-weight="normal" fill="#172b46" text-anchor="middle">ready bytes</text>
<rect x="280" y="230" width="195" height="83" rx="14" fill="#e5f2fc" stroke="#9cc5e1" stroke-width="2"/>
<text x="377.5" y="264" font-size="22" font-weight="normal" fill="#172b46" text-anchor="middle">Read / gather</text>
<text x="377.5" y="292" font-size="22" font-weight="normal" fill="#172b46" text-anchor="middle">or forward</text>
<rect x="520" y="230" width="185" height="83" rx="14" fill="#e5f2fc" stroke="#9cc5e1" stroke-width="2"/>
<text x="612.5" y="264" font-size="22" font-weight="normal" fill="#172b46" text-anchor="middle">Checker</text>
<text x="612.5" y="292" font-size="22" font-weight="normal" fill="#172b46" text-anchor="middle">or GPU</text>
