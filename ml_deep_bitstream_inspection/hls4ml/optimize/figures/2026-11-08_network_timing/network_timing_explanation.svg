<text x="1090" y="897" font-size="22" font-weight="bold" fill="#20734e" text-anchor="start">350 MHz: 2.86 ns</text>
<text x="785" y="942" font-size="22" font-weight="bold" fill="#172b46" text-anchor="start">Application logic</text>
<text x="785" y="977" font-size="22" font-weight="normal" fill="#172b46" text-anchor="start">250 MHz: 4.00 ns</text>
<path d="M1015 969 L1072 969" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1090" y="977" font-size="22" font-weight="bold" fill="#20734e" text-anchor="start">200 MHz: 5.00 ns</text>
<text x="785" y="1018" font-size="19" font-weight="normal" fill="#172b46" text-anchor="start">Lower clocks can affect speed; routed timing must pass.</text>
<text x="40" y="1072" font-size="17" font-weight="normal" fill="#172b46" text-anchor="start">Schematic, not a placement map. Slack includes data-path and clock effects. Resource evidence: OPT_11 attempt_01 vs OPT_13 attempt_06.</text>
<text x="40" y="1098" font-size="17" font-weight="normal" fill="#172b46" text-anchor="start">Created 2026-11-08. HBM “paths” are Coyote interfaces, not the physical count of HBM banks.</text>
