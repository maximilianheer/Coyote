<g font-family="DejaVu Sans, sans-serif" fill="#172b46">
<text x="40" y="55" font-size="36" font-weight="bold" fill="#172b46" text-anchor="start">Why the network builds are harder to time</text>
<text x="40" y="91" font-size="23" font-weight="normal" fill="#172b46" text-anchor="start">Adding RoCE changes the hardware and its placement—not just where the bytes enter.</text>
